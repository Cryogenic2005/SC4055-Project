description = "Repository for the SC4055 Quantum Computing project"
authors = [
    { name = "Le Nguyen Bao Huy", email = "leng0041@e.ntu.edu.sg" },
    { name = "Yang Mingchen", email = "" },
    { name = "Poobanchuen Panjapong", email = "" },
    { name = "Wang Jianning", email = "" },
]
readme = "README.md"
