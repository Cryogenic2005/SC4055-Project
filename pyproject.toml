    "jax[cpu]==0.10.2",
    "jaxlib==0.10.2",
    "optax==0.2.8",
    "numpy>=2.0,<3",
    "scipy>=1.14",
    "swig>=4.2",
    "gymnasium[classic-control,toy-text,box2d]==1.4.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pytest>=8",
]
