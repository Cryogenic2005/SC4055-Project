name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Must succeed
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev

      - name: Tests
        run: python -m pytest

      # Non-blocking: report type-checking issues
      - name: Pyright (warnings only)
        continue-on-error: true
        run: python -m pyright

      # Non-blocking: report linting issues
      - name: Ruff (warnings only)
        continue-on-error: true
        run: python -m ruff check .
